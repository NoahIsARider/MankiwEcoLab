[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mankiwecolab"
version = "2.1.0"
description = "An interactive microeconomics and macroeconomics lab built around Mankiw's Principles of Economics"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Mankiw Economics Lab" }]
keywords = ["economics", "mankiw", "microeconomics", "macroeconomics", "education", "simulation", "game-theory", "islm"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Education",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "pandas>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/NoahIsARider/MankiwEcoLab"
Repository = "https://github.com/NoahIsARider/MankiwEcoLab"
Documentation = "https://github.com/NoahIsARider/MankiwEcoLab/blob/master/USAGE.md"

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "ruff>=0.4.0",
    "nbclient>=0.9.0",
]

[project.scripts]
mankiw-econ = "main:main"

[tool.setuptools]
py-modules = ["main", "config", "experiments"]

[tool.setuptools.packages.find]
include = ["agents*", "market*", "utils*", "micro*", "macro*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py39"
exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = [
    "E501",  # 行过长: 项目含中文教学注释
    "W293",  # 空行空白: 已有代码风格保留
]
