site_name: Mankiw Economics Lab
site_description: 曼昆《经济学原理》代码实验手册 —— 从生产可能性边界到菲利普斯曲线，每个模型都能运行、实验、验证。
site_url: https://mankiwecolab.readthedocs.io/
repo_url: https://github.com/NoahIsARider/MankiwEcoLab
repo_name: NoahIsARider/MankiwEcoLab
edit_uri: edit/master/docs/
docs_dir: docs

theme:
  name: material
  language: zh
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: 切换到浅色模式
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy

nav:
  - 首页: index.md
  - 使用指南: usage.md
  - 数学模型: models.md
  - API 参考: api.md
  - 教程:
      - 01 · 供需均衡: tutorials/01-supply-demand.md
      - 02 · 价格弹性: tutorials/02-elasticity.md
      - 03 · 市场结构: tutorials/03-market-structure.md
      - 04 · 外部性与市场失灵: tutorials/04-externality.md
      - 05 · 宏观经济学导览: tutorials/05-macro-overview.md
  - 项目结构: structure.md
  - 验收报告: verification.md

plugins:
  - search:
      lang:
        - zh
        - en

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 4
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/NoahIsARider/MankiwEcoLab
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/mankiwecolab/
