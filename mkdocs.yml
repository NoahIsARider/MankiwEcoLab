site_name: Mankiw Economics Lab
site_description: A code-first companion to Mankiw's Principles of Economics — every core micro and macro model implemented as runnable, testable Python.
site_url: https://mankiwecolab.readthedocs.io/
repo_url: https://github.com/NoahIsARider/MankiwEcoLab
repo_name: NoahIsARider/MankiwEcoLab
edit_uri: edit/master/docs/
docs_dir: docs
exclude_docs: |
  *.zh-CN.md

theme:
  name: material
  language: en
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy

nav:
  - Home: index.md
  - Usage Guide: usage.md
  - Mathematical Models: models.md
  - API Reference: api.md
  - Tutorials:
      - 01 · Supply and Demand Equilibrium: tutorials/01-supply-demand.md
      - 02 · Price Elasticity: tutorials/02-elasticity.md
      - 03 · Market Structure: tutorials/03-market-structure.md
      - 04 · Externalities and Market Failure: tutorials/04-externality.md
      - 05 · Macroeconomics Overview: tutorials/05-macro-overview.md
  - Project Structure: structure.md
  - Verification Report: verification.md

plugins:
  - search:
      lang:
        - en

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 4
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/NoahIsARider/MankiwEcoLab
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/mankiwecolab/
